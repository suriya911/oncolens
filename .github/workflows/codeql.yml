name: codeql
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "python" }   # add javascript in Phase 15 (frontend)
      - uses: github/codeql-action/analyze@v3
